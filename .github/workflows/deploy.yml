name: Deploy

# Production is by hand only: pick the app and the branch ("Use workflow from"), and take the ship lock
# first: CI cannot see that lock, and a push-triggered api deploy restarted the api under
# another session's live e2e on 2026-10-26. The only push trigger left is the unify branch's web app to staging.
on:
  push:
    branches: [knrs/unify-site]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        type: choice
        options: [web, api]
        required: true
      environment:
        description: staging (staging.agentenact.io, web only) or production (the domain in servel.yaml)
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

env:
  # A push carries no inputs: it is always web to staging.
  APP: ${{ inputs.app || 'web' }}
  TARGET: ${{ inputs.environment || 'staging' }}

# One deploy per app and environment at a time; a newer run waits for the running one instead of racing it.
concurrency:
  group: deploy-${{ inputs.app || 'web' }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Staging only exists for the web app: the api has one deployment and the money path behind it.
      - name: Check the target
        if: env.APP == 'api' && env.TARGET == 'staging'
        run: |
          echo "::error::The api has no staging environment."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # Download first: piping into bash with </dev/null would feed bash an empty script.
      - name: Install servel (client only)
        run: |
          curl -fsSL https://servel.dev/install.sh -o "$RUNNER_TEMP/servel-install.sh"
          bash "$RUNNER_TEMP/servel-install.sh" --client </dev/null
          servel version

      # servel access join names the server user after the key comment and refuses a different key for the same
      # user, so CI reuses the site's deploy key and comment from the SERVEL_SSH_KEY secret.
      - name: Load the deploy SSH key
        env:
          SERVEL_SSH_KEY: ${{ secrets.SERVEL_SSH_KEY }}
        run: |
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$SERVEL_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$(ssh-keygen -y -f ~/.ssh/id_ed25519) github-actions-deploy-site" > ~/.ssh/id_ed25519.pub

      # Join by address: a token join tries to create the user again and fails once it exists.
      - name: Join the server
        run: servel access join 45.136.16.42 --name srvl

      # Staging is its own deployment: its name, domain and origin are rewritten in this checkout only, so it can
      # never take over the production name or domain. servel.yaml's env outranks .env files, hence the edit.
      - name: Point the checkout at staging
        if: env.TARGET == 'staging'
        working-directory: apps/web
        run: |
          sed -i -e 's/^name: agentenact-web$/name: agentenact-web-staging/' \
                 -e 's/^domain: .*/domain: staging.agentenact.io/' \
                 -e 's|^\(    APP_ORIGIN:\) .*|\1 https://staging.agentenact.io|' \
                 -e '/^domains:$/,/^[^ ]/{/^domains:$/d;/^    - /d}' servel.yaml
          # Production's domains list (agentenact.io, app.agentenact.io) must be gone, or staging would claim them.
          ! grep -qE '^\s*- (app\.)?agentenact\.io$' servel.yaml
          grep -q '^name: agentenact-web-staging$' servel.yaml
          grep -q '^domain: staging.agentenact.io$' servel.yaml
          grep -q 'APP_ORIGIN: https://staging.agentenact.io' servel.yaml
          head -3 servel.yaml

      # The commits may come from a bot; credit the deploy to the GitHub user who pushed or ran it.
      - name: Deploy
        working-directory: apps/${{ env.APP }}
        env:
          DEPLOYER: ${{ github.actor }}
        run: |
          servel deploy --verbose --remote srvl --author "$DEPLOYER"

      # servel verify health exits 0 even when a service is down, so ask the app itself.
      - name: Check it answers
        working-directory: apps/${{ env.APP }}
        run: |
          case "$APP-$TARGET" in
            web-staging)    url=https://staging.agentenact.io/api/health ;;
            web-production) url=https://$(sed -n 's/^domain: //p' servel.yaml)/api/health ;;
            api-production) url=https://api.agentenact.io/health ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 8 --retry-all-errors "$url")
          echo "$url → $code"
          [ "$code" = 200 ]
